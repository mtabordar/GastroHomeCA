name: Playwright mcpServer
version: 0.0.1
schema: v1
mcpServers:
  - name: Browser search
    command: npx
    args:
      - "-y"
      - "@playwright/mcp@latest"
    env:
      PLAYWRIGHT_CHROME_PATH: "/usr/bin/chromium"
      EXECUTABLE_PATH: "/usr/bin/chromium"
  - name: Context7 search
    command: npx
    args:
      - "-y"
      - "@upstash/context7-mcp"
